  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

i style=\"display:flex\"><a href=\"#contact\" aria-current=\"{{ cur.contact }}\" style=\"color:var(--bg);background:var(--ink);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;min-height:2.75rem;box-sizing:border-box;display:inline-flex;align-items:center\" style-hover=\"background:var(--accent)\">Get in touch<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n    <button type=\"button\" aria-expanded=\"{{ menuExpanded }}\" aria-controls=\"mobile-nav\" sc-camel-on-click=\"{{ toggleMenu }}\" sc-camel-on-key-down=\"{{ menuKey }}\" style=\"font:inherit;font-weight:700;font-size:1.125rem;color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:12px 22px;min-height:3rem;cursor:pointer\">{{ menuLabel }}<\u002Fbutton>\n  <\u002Fsc-if>\n  <button type=\"button\" role=\"switch\" aria-checked=\"{{ darkPressed }}\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"margin-left:auto;font:inherit;font-weight:500;font-size:1.125rem;color:var(--ink);background:transparent;border:0;padding:0 4px;min-height:2.75rem;display:inline-flex;align-items:center;gap:10px;cursor:pointer\">\n    Dark mode\n    <span aria-hidden=\"true\" style=\"width:2.75rem;height:1.5rem;border-radius:999px;border:2px solid var(--ink);background:{{ trackBg }};box-sizing:border-box;display:flex;align-items:center;padding:2px;justify-content:{{ knobPos }}\"><span style=\"width:1rem;height:1rem;border-radius:50%;background:{{ knobBg }}\"><\u002Fspan><\u002Fspan>\n  <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n<sc-if value=\"{{ showMobileNav }}\" hint-placeholder-val=\"{{ false }}\">\n  <nav id=\"mobile-nav\" aria-label=\"Main\" sc-camel-on-key-down=\"{{ menuKey }}\" style=\"max-width:75rem;margin:0 auto;padding:0 clamp(20px,4vw,48px) 24px\">\n    <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:2px solid var(--ink)\">\n      <sc-for list=\"{{ navItemsAll }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <li style=\"border-bottom:1.5px solid var(--line)\"><a href=\"{{ n.href }}\" aria-current=\"{{ n.current }}\" style=\"color:var(--ink);text-decoration:{{ n.deco }};text-decoration-thickness:2px;text-underline-offset:6px;font-weight:700;font-size:1.25rem;min-height:3.5rem;padding:8px 0;box-sizing:border-box;display:flex;align-items:center\">{{ n.label }}<\u002Fa><\u002Fli>\n      <\u002Fsc-for>\n    <\u002Ful>\n  <\u002Fnav>\n<\u002Fsc-if>\n\n<main id=\"main\" tabindex=\"-1\">\n<sc-if value=\"{{ is.home }}\" hint-placeholder-val=\"{{ true }}\">\n<section aria-labelledby=\"hero-title\" style=\"max-width:75rem;margin:0 auto;padding:clamp(40px,7vw,96px) clamp(20px,4vw,48px) clamp(48px,7vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26.25rem),1fr));gap:clamp(32px,5vw,72px);align-items:center\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <h1 id=\"hero-title\" tabindex=\"-1\" style=\"margin:0;font-size:clamp(2.5rem,calc(1.6rem + 2.5vw),4.5rem);line-height:1.04;letter-spacing:-0.03em;font-weight:800;color:var(--ink);text-wrap:balance\">Mobile accessibility consultant<\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(1.375rem,calc(1rem + 1.8vw),2rem);line-height:1.3;font-weight:500;color:var(--ink-2);text-wrap:balance\">I build mobile apps <span style=\"color:var(--accent)\">everyone<\u002Fspan> can use.<\u002Fp>\n    <p style=\"margin:0;font-size:clamp(1.188rem,calc(0.831rem + 1.6vw),1.375rem);max-width:40ch;color:var(--ink-2);text-wrap:pretty\">I’m Fanny Demey: mobile developer, speaker, author and accessibility consultant. I’m also recognized by Google as an <strong style=\"color: var(--ink);\">Android Google Developer Expert<\u002Fstrong>. I spend 90% of my time writing Android and iOS code on Tech for Good projects. The rest of the time, I help teams make their apps genuinely accessible, down to the line of code.<\u002Fp>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n      <a href=\"#offer\" style=\"display:inline-flex;align-items:center;min-height:3.25rem;padding:12px 26px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none\" style-hover=\"background:var(--ink);color:var(--bg)\">See what I offer<\u002Fa>\n      <a href=\"{{ ctaHref }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;display:inline-flex;align-items:center;min-height:3.25rem;padding:12px 26px;box-sizing:border-box;border-radius:999px;border:2px solid var(--ink);color:var(--ink);font-weight:700;text-decoration:none;box-sizing:border-box\" style-hover=\"background:var(--ink);color:var(--bg)\">{{ ctaLabel }}<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\"> (opens in a new tab)<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div aria-hidden=\"true\" style=\"position:relative;aspect-ratio:4/5;max-height:38.75rem;width:100%;justify-self:center;max-width:31.25rem\">\n    <image-slot id=\"portrait\" shape=\"rounded\" radius=\"24\" placeholder=\"Portrait of Fanny\" style=\"width:100%;height:100%\" src=\"821ad5eb-319f-43ed-a5a7-cb89f38ceb25\"><\u002Fimage-slot>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"profile-title\" style=\"border-top:1.5px solid var(--line);max-width:75rem;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:48px\">\n    <h2 id=\"profile-title\" style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">About me<\u002Fh2>\n    <p style=\"margin:0;font-size:clamp(1.25rem,calc(0.9rem + 1.4vw),1.625rem);line-height:1.35;font-weight:500;color:var(--ink-2);max-width:40ch;text-wrap:pretty\">Developer, speaker, accessibility advocate.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15.625rem),1fr));gap:20px\">\n    <article style=\"background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:14px\">\n      <span aria-hidden=\"true\" style=\"font-size:1.063rem;color:var(--accent);font-weight:500\">01<\u002Fspan>\n      <h3 style=\"margin:0;font-size:1.625rem;letter-spacing:-0.01em\">Technical<\u002Fh3>\n      <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">Android Google Developer Expert. I also ship iOS on Tech for Good projects. I love working on UI and UX, especially with Jetpack Compose on Android. I care about code quality, and about finding the solution that best fits each client, without over-engineering.<\u002Fp>\n      <a href=\"{{ linkedinUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;margin-top:auto;font-weight:700;min-height:2.75rem;display:inline-flex;align-items:center\">See my LinkedIn<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\"> (opens in a new tab)<\u002Fspan><\u002Fa>\n    <\u002Farticle>\n    <article style=\"background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:14px\">\n      <span aria-hidden=\"true\" style=\"font-size:1.063rem;color:var(--accent);font-weight:500\">02<\u002Fspan>\n      <h3 style=\"margin:0;font-size:1.625rem;letter-spacing:-0.01em\">Sharing knowledge<\u002Fh3>\n      <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">I’ve been giving technical talks since 2018. I love helping other to get to know the best practices faster. My favourite topics: accessibility, user experience and sustainability. I give 3–5 talks a year, and I wrote a book on Android and accessibility.<\u002Fp>\n      <a href=\"#talks\" style=\"margin-top:auto;font-weight:700;min-height:2.75rem;display:inline-flex;align-items:center\">See my talks<\u002Fa>\n    <\u002Farticle>\n    <article style=\"background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:14px\">\n      <span aria-hidden=\"true\" style=\"font-size:1.063rem;color:var(--accent);font-weight:500\">03<\u002Fspan>\n      <h3 style=\"margin:0;font-size:1.625rem;letter-spacing:-0.01em\">Accessibility focus<\u002Fh3>\n      <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">I’ve worked on two apps built for people with disabilities, including one I still develop today, where accessibility is at the heart of every feature. These projects gave me the confidence to share what I learned about mobile accessibility, and they keep shaping my practice. Today, as a consultant, I help teams make their own apps accessible.<\u002Fp>\n      <a href=\"#offer\" style=\"margin-top:auto;font-weight:700;min-height:2.75rem;display:inline-flex;align-items:center\">See my services<\u002Fa>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.work }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"work-h1\" style=\"color:var(--ink)\">\n  <div style=\"max-width:75rem;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:56px;max-width:47.5rem\">\n      <h1 id=\"work-h1\" tabindex=\"-1\" style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Development work<\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(1.188rem,calc(0.831rem + 1.6vw),1.375rem);line-height:1.5;color:var(--ink-2);max-width:62ch;text-wrap:pretty\">I develop native apps for Android and iOS. On two of these projects, most of my users have a disability, so accessibility is at the heart of every feature. Working side by side with the people who use these apps has taught me what a good experience really means for them, and today it helps me choose the best way to make something accessible.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,27.5rem),1fr));gap:clamp(32px,5vw,64px)\">\n      <article style=\"display:flex;flex-direction:column;gap:16px;border-top:2px solid var(--accent);padding-top:28px\">\n        <h2 style=\"margin:0;font-size:clamp(1.75rem,calc(1.225rem + 2.5vw),2.25rem);letter-spacing:-0.015em\">Localisateur<\u002Fh2>\n        <p style=\"margin:0;font-size:1.25rem;font-weight:700;color:var(--ink)\">Valentin Haüy Foundation, for blind and low-vision users<\u002Fp>\n        <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">The Valentin Haüy Foundation is France’s largest association for blind and low-vision people. I’m currently developing their app, which fills the gaps the rest of the world leaves inaccessible.<\u002Fp>\n        <ul style=\"margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:var(--ink)\">\n          <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent)\">—<\u002Fspan>Where am I? When is the next bus? When do I get off?<\u002Fli>\n          <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent)\">—<\u002Fspan>An audio player built for audiobooks<\u002Fli>\n          <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent)\">—<\u002Fspan>And many more everyday tools, screen-reader first<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article style=\"display:flex;flex-direction:column;gap:16px;border-top:2px solid var(--accent);padding-top:28px\">\n        <h2 style=\"margin:0;font-size:clamp(1.75rem,calc(1.225rem + 2.5vw),2.25rem);letter-spacing:-0.015em\">Alzheimer’s care app<\u002Fh2>\n        <p style=\"margin:0;font-size:1.25rem;font-weight:700;color:var(--ink)\">One year, for patients and caregivers<\u002Fp>\n        <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">I spent a year building for people living with Alzheimer’s disease and the people who help them. The work was about cognitive accessibility: clear flows, low memory load and room for mistakes.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fsc-if>\n<sc-if value=\"{{ is.consultancy }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"consult-h1\">\n  <div style=\"max-width:75rem;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:47.5rem\">\n        <h1 id=\"consult-h1\" tabindex=\"-1\" style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Consultancy work<\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(1.188rem,calc(0.831rem + 1.6vw),1.375rem);line-height:1.5;color:var(--ink-2);max-width:62ch;text-wrap:pretty\">Every team is at a different stage, so I adapt how I help to what you need. Here are a few examples of how I’ve worked with teams.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;border-top:1.5px solid var(--line)\">\n        <article style=\"padding:clamp(28px,4vw,40px) 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:52rem\">\n          <h2 style=\"margin:0;font-size:clamp(1.25rem,calc(0.875rem + 2vw),1.5rem);font-weight:700;color:var(--accent)\"><span aria-hidden=\"true\">01 · <\u002Fspan>Q&amp;A sessions<\u002Fh2>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">For teams who already know accessibility well and want to go further on mobile: Android and iOS specifics, assistive technologies, and the edge cases of native components.<\u002Fp>\n          <p style=\"margin:4px 0 0;color:var(--ink-2);font-size:1.25rem;text-wrap:pretty\"><strong style=\"color: var(--ink);\">Teams I’ve helped:<\u002Fstrong> AnySurfer, a Belgian accessibility organisation.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"padding:clamp(28px,4vw,40px) 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:52rem\">\n          <h2 style=\"margin:0;font-size:clamp(1.25rem,calc(0.875rem + 2vw),1.5rem);font-weight:700;color:var(--accent)\"><span aria-hidden=\"true\">02 · <\u002Fspan>Mobile accessibility training<\u002Fh2>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">A hands-on training in 1 or 2 days, built around a sample app your team improves step by step. Everyone learns to design, test and fix accessible mobile interfaces on iOS and Android.<\u002Fp>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)\">\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span>Using VoiceOver, TalkBack and native accessibility settings<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span>Accessible text, images, design, states and forms<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span>Optimising the screen reader experience<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span>manual and automated testing<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">For mobile developers, designers, QA and technical product owners.<\u002Fp>\n          <p style=\"margin:4px 0 0;color:var(--ink-2);font-size:1.25rem;text-wrap:pretty\"><strong style=\"color:var(--ink)\">Teams I’ve trained:<\u002Fstrong> Leboncoin (French equivalent of Gumtree), France Télévisions (French equivalent of the BBC), Crédit Agricole, AXA and more.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"padding:clamp(28px,4vw,40px) 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:52rem\">\n          <h2 style=\"margin:0;font-size:clamp(1.25rem,calc(0.875rem + 2vw),1.5rem);font-weight:700;color:var(--accent)\"><span aria-hidden=\"true\">03 · <\u002Fspan>Finding the right fix<\u002Fh2>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">Sometimes the issue is clear but the best way to fix it isn’t. I work with your team to weigh the options and pick the solution that works best for your users and your codebase. As a mobile developer with accessibility expertise, I also bridge the gap between developers and accessibility teams, who don’t always know the specifics of mobile.<\u002Fp>\n          <p style=\"margin:4px 0 0;color:var(--ink-2);font-size:1.25rem;text-wrap:pretty\"><strong style=\"color:var(--ink)\">Teams I’ve helped:<\u002Fstrong> E.Leclerc (French equivalent of Tesco), AXA, Crédit Agricole, La Redoute (French equivalent of Next), BNP Paribas and more.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"padding:clamp(28px,4vw,40px) 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:52rem\">\n          <h2 style=\"margin:0;font-size:clamp(1.25rem,calc(0.875rem + 2vw),1.5rem);font-weight:700;color:var(--accent)\"><span aria-hidden=\"true\">04 · <\u002Fspan>Pre-audit<\u002Fh2>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">Before you apply for an official audit, I review your app so your team can tackle most issues first. Every issue I find comes with a suggested fix.<\u002Fp>\n          <p style=\"margin:4px 0 0;color:var(--ink-2);font-size:1.25rem;text-wrap:pretty\"><strong style=\"color:var(--ink)\">Teams I’ve helped:<\u002Fstrong> Université de Lille, Geneva University Hospitals (with Idéance), Leocare (insurance), AXA and more.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"padding:clamp(28px,4vw,40px) 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:52rem\">\n          <h2 style=\"margin:0;font-size:clamp(1.25rem,calc(0.875rem + 2vw),1.5rem);font-weight:700;color:var(--accent)\"><span aria-hidden=\"true\">05 · <\u002Fspan>Long-term support<\u002Fh2>\n          <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">I join your team a few days each month to work towards long-term accessibility goals, so accessibility becomes a natural part of your product and development process.<\u002Fp>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:var(--ink-2)\">\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong style=\"color:var(--ink)\">Hands-on with your developers:<\u002Fstrong> I fix issues myself and run pair and mob programming sessions to share knowledge.<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong style=\"color:var(--ink)\">Across roles:<\u002Fstrong> I work with QA, product, design and development to keep accessibility part of every conversation.<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong style=\"color:var(--ink)\">Tailored practices:<\u002Fstrong> we set up best practices that fit your company’s needs, your team’s skills and each person’s interests.<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong style=\"color:var(--ink)\">Beyond your team:<\u002Fstrong> I help you organise with the teams around you.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:4px 0 0;color:var(--ink-2);font-size:1.25rem;text-wrap:pretty\"><strong style=\"color:var(--ink)\">Teams I’ve helped:<\u002Fstrong> AXA, Leocare (insurance), Crédit Agricole and more.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ is.talks }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"talks-title\" style=\"max-width:75rem;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:40px\">\n    <h1 id=\"talks-title\" tabindex=\"-1\" style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Knowledge sharing<\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(1.25rem,calc(0.9rem + 1.4vw),1.625rem);line-height:1.35;font-weight:500;color:var(--ink-2);text-wrap:pretty\">Here you’ll find my talks, my book and my online course on mobile accessibility and Android.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-bottom:clamp(56px,8vw,96px);display:flex;flex-direction:column;gap:24px\">\n    <h2 style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Book<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);align-items:center\">\n    <img src=\"dd01ca69-5eea-4035-b6ab-262458575a7a\" alt=\"\" style=\"flex:1 1 10rem;max-width:16rem;width:100%;height:auto;border-radius:6px;border:1.5px solid var(--line);display:block\">\n    <div style=\"flex:999 1 18rem;min-width:0;display:flex;flex-direction:column;gap:12px\">\n      <h3 id=\"book-title\" style=\"margin:0;font-size:clamp(1.75rem,calc(1.2rem + 2.5vw),2.625rem);line-height:1.15;letter-spacing:-0.015em;text-wrap:balance\">Jetpack Compose: Build Accessible, Modern Interfaces for Android<\u002Fh3>\n      <p style=\"margin:0;color:var(--ink-3);font-style:italic\">Original French title: <span lang=\"fr\">Jetpack Compose : Développez des interfaces accessibles et modernes pour Android<\u002Fspan><\u002Fp>\n      <p style=\"margin:0;font-size:1.25rem;font-weight:700;color:var(--ink-3)\">Éditions ENI, 2023, 488 pages, in French<\u002Fp>\n      <p style=\"margin:0;color:var(--ink-2);max-width:56ch;text-wrap:pretty\">A step-by-step guide to building modern Android interfaces with Jetpack Compose. Every chapter includes accessibility best practices with concrete examples.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:8px\">\n        <a href=\"https://www.amazon.fr/Jetpack-Compose-D%C3%A9veloppez-interfaces-accessibles/dp/2409039669\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;display:inline-flex;align-items:center;min-height:3rem;padding:10px 22px;box-sizing:border-box;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none\" style-hover=\"background:var(--accent);color:var(--on-accent)\">Get the book on Amazon<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\"> (opens in a new tab)<\u002Fspan><\u002Fa>\n        <a href=\"https://www.editions-eni.fr/livre/jetpack-compose-developpez-des-interfaces-accessibles-et-modernes-pour-android-9782409039669\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;display:inline-flex;align-items:center;min-height:3rem;padding:10px 22px;box-sizing:border-box;border-radius:999px;border:2px solid var(--ink);color:var(--ink);font-weight:700;text-decoration:none;box-sizing:border-box\" style-hover=\"background:var(--ink);color:var(--bg)\">Read excerpts at ENI<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\"> (opens in a new tab)<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-bottom:clamp(56px,8vw,96px);display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Online courses<\u002Fh2>\n    <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1.5px solid var(--line)\">\n      <li style=\"display:flex;flex-direction:column;gap:8px;padding:28px 0;border-bottom:1.5px solid var(--line)\">\n        <span style=\"font-size:1.063rem;font-weight:500;color:var(--accent)\">7 August 2026<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(1.313rem,calc(0.919rem + 2.2vw),1.625rem);line-height:1.25;letter-spacing:-0.01em;text-wrap:pretty\">Build dynamic Android interfaces with Jetpack Compose<\u002Fh3>\n        <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">A hands-on course for Android developers who want to build modern, responsive apps with Jetpack Compose. You learn to build and style components, manage state and events, handle side effects and set up smooth navigation.<\u002Fp>\n        <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\"><strong style=\"color:var(--ink)\">You’ll learn to:<\u002Fstrong> set up your project, add and style your first components, lay out the main screen and finalise your app’s structure.<\u002Fp>\n        <p style=\"margin:0;color:var(--ink-3);font-size:1.125rem;text-wrap:pretty\">For developers comfortable with Kotlin, MVVM basics and a first Android app.<\u002Fp>\n        <div style=\"display:flex;gap:8px 24px;flex-wrap:wrap;align-items:center;margin-top:4px\">\n          <span style=\"color:var(--ink-3);font-size:1.125rem\">100 viewers<\u002Fspan>\n          <a href=\"https://openclassrooms.com/fr/courses/8372601-utilisez-jetpack-compose-pour-developper-des-interfaces-android-dynamiques/8473721-creez-votre-projet-utilisant-jetpack-compose\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;font-weight:700;font-size:1.125rem;min-height:2.75rem;display:inline-flex;align-items:center\" hreflang=\"fr\">Read on OpenClassrooms (French)<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">: Build dynamic Android interfaces with Jetpack Compose (opens in a new tab)<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:24px\">\n    <h2 style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Talks<\u002Fh2>\n    <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">I’ve been giving talks since 2018. They’re listed below from newest to oldest, with replays and event pages where available.<\u002Fp>\n  <\u002Fdiv>\n  <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n    <sc-for list=\"{{ talks }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <li style=\"display:flex;flex-direction:column;gap:8px;padding:28px 0;border-bottom:1.5px solid var(--line)\">\n        <h3 style=\"order:2;margin:0;font-size:clamp(1.313rem,calc(0.919rem + 2.2vw),1.625rem);line-height:1.25;letter-spacing:-0.01em;text-wrap:pretty\">{{ t.title }}<\u002Fh3>\n        <span style=\"order:0;font-size:1.063rem;font-weight:500;color:var(--accent)\">{{ t.year }}<\u002Fspan>\n        <div style=\"display:contents\">\n          <div style=\"order:1;display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <span style=\"font-weight:700\">{{ t.event }}<\u002Fspan>\n            <span style=\"font-size:1.125rem;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--ink);padding:4px 12px;border-radius:999px;line-height:1.3\">{{ t.lang }}<\u002Fspan>\n            <sc-if value=\"{{ t.online }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:1.125rem;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--ink);padding:4px 12px;border-radius:999px;line-height:1.3\">Online<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ t.original }}\" hint-placeholder-val=\"{{ false }}\"><p lang=\"fr\" style=\"order:3;margin:0;color:var(--ink-3);font-style:italic;text-wrap:pretty\">{{ t.original }}<\u002Fp><\u002Fsc-if>\n          <div style=\"order:4;display:flex;gap:8px 24px;flex-wrap:wrap;align-items:center;margin-top:4px\">\n            <sc-if value=\"{{ t.meta }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:var(--ink-3);font-size:1.125rem\">{{ t.meta }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ t.replay }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ t.replay }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;font-weight:700;font-size:1.125rem;min-height:2.75rem;display:inline-flex;align-items:center\">Watch replay<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">: {{ t.title }} (opens in a new tab)<\u002Fspan><\u002Fa><\u002Fsc-if>\n            <sc-if value=\"{{ t.agenda }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ t.agenda }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;font-weight:700;font-size:1.125rem;min-height:2.75rem;display:inline-flex;align-items:center\">Event page<span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">: {{ t.event }} (opens in a new tab)<\u002Fspan><\u002Fa><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ is.offer }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-labelledby=\"offer-title\" style=\"max-width:75rem;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,48px)\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:48px\">\n    <h1 id=\"offer-title\" tabindex=\"-1\" style=\"margin:0;font-size:clamp(2.125rem,calc(1.487rem + 2.5vw),3.375rem);line-height:1.08;letter-spacing:-0.02em;font-weight:800;color:var(--ink);text-wrap:balance\">Accessibility services<\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(1.25rem,calc(0.9rem + 1.4vw),1.625rem);line-height:1.35;font-weight:500;color:var(--ink-2);text-wrap:pretty\">I give you guidance as someone who writes code every day.<\u002Fp>\n    <p style=\"margin:0;font-size:1.25rem;color:var(--ink-2);max-width:70ch;text-wrap:pretty\">I work on Android and iOS, whether your app is native or built with a cross-platform technology. My approach is hands-on and practical, and every recommendation comes with a concrete fix.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,27.5rem),1fr));gap:20px;align-items:stretch\">\n    <article style=\"background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-size:2rem;letter-spacing:-0.015em\">Training<\u002Fh2>\n        <span style=\"font-size:1.125rem;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--ink);padding:4px 12px;border-radius:999px;line-height:1.3\">1 day<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">A full day of mobile accessibility for your team. Android and iOS, with other cross-platform technologies on request.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan>How assistive technologies really work<\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan>Practical exercises on a sample project<\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan>Finding and fixing real issues in code<\u002Fli>\n      <\u002Ful>\n      <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:auto;padding-top:22px;border-top:1.5px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n          <strong style=\"font-size:2.75rem;letter-spacing:-0.02em;line-height:1\">£900<\u002Fstrong><span style=\"color:var(--ink-3)\">per day<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <article style=\"background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-size:2rem;letter-spacing:-0.015em\">Consulting<\u002Fh2>\n        <span style=\"font-size:1.125rem;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--ink);padding:4px 12px;border-radius:999px;line-height:1.3\">Daily or hourly<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;color:var(--ink-2);text-wrap:pretty\">Flexible support shaped around where your team is right now.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong>Focused talks:<\u002Fstrong> short sessions on one accessibility topic<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong>Accessibility QA:<\u002Fstrong> testing your app with assistive tech<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong>Team support:<\u002Fstrong> working with your team on the issues blocking you<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--accent);font-weight:800\">✓<\u002Fspan><span><strong>Pre-audit:<\u002Fstrong> preparing for an official audit, or reviewing your current practice. Every issue comes with a suggested fix.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:auto;padding-top:22px;border-top:1.5px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n          <strong style=\"font-size:2.75rem;letter-spacing:-0.02em;line-height:1\">£800<\u002Fstrong><span style=\"color:var(--ink-3)\">per day (7 hours) · can be billed hourly<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Farticle>\n    <article style=\"background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-size:2rem;letter-spacing:-0.015em\">Long-term support<\u002Fh2>\n        <span style=\"font-size:1.125rem;fon  des cases','FR',200,1400,'https://www.youtube.com/watch?v=Nz4WvE6Fo-U',0],\n    ['2018','Devfest Nantes',0,'“Process Communication” or How to Fit People into Boxes','La « process communication » ou comment faire rentrer les gens dans des cases','FR',300,8800,'https://www.youtube.com/watch?v=Tv6Fclmr1rU','https://devfest2018.gdgnantes.com/schedule/day2'],\n    ['2018','Devoxx France',0,'How to use native Android/iOS code from a React Native app','Comment utiliser du code natif Android/iOS depuis une app React Native','FR',100,993,'https://www.youtube.com/watch?v=QZTFgAy-CG8',0]\n  ].map(([year,event,online,title,original,lang,aud,views,replay,agenda]) => ({\n    year, event, online: !!online, title, original, lang: lang === 'FR' ? 'French' : 'English',\n    meta: [aud ? 'About ' + aud.toLocaleString('en-GB') + ' attendees' : '', views ? views.toLocaleString('en-GB') + ' replay views' : ''].filter(Boolean).join(' · '),\n    replay: replay || '', agenda: agenda || ''\n  }));\n  sync = () => {\n    let p = (window.location.hash || '').slice(1); if (p === 'profile') p = 'home';\n    if (this.pages.includes(p) && p !== this.state.page) { this.setState({ page: p, menuOpen: false }); window.scrollTo({ top: 0, behavior: 'instant' }); }\n    else if ((!p || p === 'home') && this.state.page !== 'home') this.setState({ page: 'home', menuOpen: false });\n  };\n  labels = { home: 'About me', profile: 'Profile', work: 'Development work', consultancy: 'Consultancy work', talks: 'Knowledge sharing', offer: 'Services', contact: 'Contact' };\n  componentDidMount() {\n    document.documentElement.lang = 'en';\n    let saved = null; try { saved = localStorage.getItem('fanny-theme'); } catch (e) {}\n    const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;\n    this.applyTheme(dark); this.setState({ dark });\n    this.mq = window.matchMedia('(max-width: 60em)');\n    this.onMq = () => this.setState({ narrow: this.mq.matches, menuOpen: false });\n    this.mq.addEventListener('change', this.onMq);\n    this.setState({ narrow: this.mq.matches });\n    window.addEventListener('hashchange', this.sync); this.sync(); this.setTitle();\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.sync); this.mq && this.mq.removeEventListener('change', this.onMq); }\n  setTitle() { const l = this.labels[this.state.page]; document.title = (this.state.page === 'home' ? 'Fanny' : l + ' · Fanny') + ' · Mobile accessibility consultant'; }\n  componentDidUpdate() {\n    if (this._lastPage === undefined) { this._lastPage = this.state.page; return; }\n    if (this._lastPage !== this.state.page) {\n      this._lastPage = this.state.page;\n      this.setTitle();\n      requestAnimationFrame(() => { const el = document.querySelector('#main h1'); el && el.focus({ preventScroll: true }); });\n    }\n  }\n  renderVals() {\n    const page = this.state.page, is = {}, deco = {}, cur = {};\n    this.pages.forEach(k => { is[k] = page === k; deco[k] = page === k ? 'underline' : 'none'; cur[k] = page === k ? 'page' : 'false'; });\n    const show = this.props.showPrices ?? true;\n    const linkedinUrl = this.props.linkedinUrl || 'https://www.linkedin.com/in/fannydemey/';\n    return {\n      linkedinUrl,\n      skipToMain: (e) => { e.preventDefault(); const m = document.getElementById('main'); m && m.focus(); },\n      darkPressed: this.state.dark ? 'true' : 'false',\n      knobPos: this.state.dark ? 'flex-end' : 'flex-start',\n      trackBg: this.state.dark ? 'var(--ink)' : 'transparent',\n      knobBg: this.state.dark ? 'var(--bg)' : 'var(--ink)',\n      toggleTheme: () => { const dark = !this.state.dark; this.applyTheme(dark); try { localStorage.setItem('fanny-theme', dark ? 'dark' : 'light'); } catch (e) {} this.setState({ dark }); },\n      wide: !this.state.narrow, narrow: this.state.narrow,\n      showMobileNav: this.state.narrow && this.state.menuOpen,\n      menuExpanded: this.state.menuOpen ? 'true' : 'false',\n      menuLabel: this.state.menuOpen ? 'Close menu' : 'Menu',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      menuKey: (e) => { if (e.key === 'Escape' && this.state.menuOpen) { this.setState({ menuOpen: false }); const b = document.querySelector('[aria-controls=\"mobile-nav\"]'); b && b.focus(); } },\n      navItems: ['home','work','consultancy','talks','offer'].map(k => ({ href: '#' + k, label: this.labels[k], current: cur[k], deco: deco[k] })),\n      navItemsAll: ['home','work','consultancy','talks','offer','contact'].map(k => ({ href: '#' + k, label: this.labels[k], current: cur[k], deco: deco[k] })),\n      is, deco, cur, talks: this.talkData, talkCount: this.talkData.length,\n      showPrices: show,\n      hidePrices: !show,\n      ctaLabel: 'Message me on LinkedIn',\n      ctaHref: linkedinUrl,\n      year: new Date().getFullYear()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
